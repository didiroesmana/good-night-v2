default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: good_night_v2_development
  queue:
    <<: *default
    database: good_night_v2_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: good_night_v2_test

production:
  primary:
    <<: *default
    database: good_night_v2_production
    username: <%= ENV["GOOD_NIGHT_V2_DATABASE_USERNAME"] %>
    password: <%= ENV["GOOD_NIGHT_V2_DATABASE_PASSWORD"] %>
    host: <%= ENV["GOOD_NIGHT_V2_DATABASE_HOST"] %>
    port: <%= ENV["GOOD_NIGHT_V2_DATABASE_PORT"] || 5432 %>
  cache:
    <<: *default
    database: good_night_v2_production_cache
    username: <%= ENV["GOOD_NIGHT_V2_DATABASE_USERNAME"] %>
    password: <%= ENV["GOOD_NIGHT_V2_DATABASE_PASSWORD"] %>
    host: <%= ENV["GOOD_NIGHT_V2_DATABASE_HOST"] %>
    port: <%= ENV["GOOD_NIGHT_V2_DATABASE_PORT"] || 5432 %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: good_night_v2_production_queue
    username: <%= ENV["GOOD_NIGHT_V2_DATABASE_USERNAME"] %>
    password: <%= ENV["GOOD_NIGHT_V2_DATABASE_PASSWORD"] %>
    host: <%= ENV["GOOD_NIGHT_V2_DATABASE_HOST"] %>
    port: <%= ENV["GOOD_NIGHT_V2_DATABASE_PORT"] || 5432 %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: good_night_v2_production_cable
    username: <%= ENV["GOOD_NIGHT_V2_DATABASE_USERNAME"] %>
    password: <%= ENV["GOOD_NIGHT_V2_DATABASE_PASSWORD"] %>
    host: <%= ENV["GOOD_NIGHT_V2_DATABASE_HOST"] %>
    port: <%= ENV["GOOD_NIGHT_V2_DATABASE_PORT"] || 5432 %>
    migrations_paths: db/cable_migrate